[project]
name = "elynd-worlds"
version = "0.1.0"
description = "A painted world for every meditation, designed, painted, checked and brought to life with Meta's models."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.57",
    "httpx>=0.27",
    "pillow>=10.1",
    "numpy>=1.26",
    "meta-sam-parser>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
elynd-worlds = "elynd_worlds.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["elynd_worlds*"]

[tool.setuptools.package-data]
elynd_worlds = ["fonts/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
